services:
  llmops-ui:
    image: llmops-ui:${IMAGE_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: ui/Dockerfile
    container_name: llmops-ui
    restart: always
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"

  llmops-api:
    image: llmops-api:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-api
    restart: always
    volumes:
      - ../api:/app/api
      - ./volumes/app/storage:/app/api/storage
      - ./docker-compose.yaml:/app/docker/docker-compose.yaml:ro
      - ./nginx/entrypoint.sh:/app/docker/nginx/entrypoint.sh:ro
      - ../ui/Dockerfile:/app/ui/Dockerfile:ro
    # 从 api/.env 读取配置
    env_file:
      - ../api/.env
    environment:
      # Docker 环境特定配置（覆盖 .env 中的对应配置）
      APP_ENV: production
      APP_DEBUG: '0'
      SERVER_THREAD_AMOUNT: 32
      GUNICORN_TIMEOUT: '0'
      SQLALCHEMY_ECHO: 'false'
      MODE: asgi
      # HTTP 层已 100% 迁移到 Quart（uvicorn 多 worker 承载）
      ASGI_WORKER_AMOUNT: 2
      # HTTP 单栈：Quart（uvicorn）承载全部 HTTP，Http 容器仅作依赖宿主
      SKILL_CATALOG_SYNC_ENABLED: 'true'
      MIGRATION_ENABLED: 'true'
      SYSTEM_ACCESS_WORKSPACE: /app/api/storage/system_access_workspace
      # kkFileView 预览：其服务端下载文件时使用的内网可达基础地址
      KKFILEVIEW_FILE_HOST: http://llmops-nginx:80
      POSTGRES_HOST: llmops-db
      POSTGRES_PORT: 5432
      # Redis 连接使用 Docker 服务名
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      # Neo4j 连接（记忆系统 TKG）
      NEO4J_URI: bolt://llmops-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      # MinIO 连接（记忆系统对象存储）
      MINIO_ENDPOINT: http://llmops-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${API_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy

  llmops-celery:
    image: llmops-api:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-celery
    restart: always
    volumes:
      - ../api:/app/api
      - ./volumes/app/storage:/app/api/storage
    # 从 api/.env 读取配置
    env_file:
      - ../api/.env
    environment:
      # Docker 环境特定配置（覆盖 .env 中的对应配置）
      APP_ENV: production
      APP_DEBUG: '0'
      SQLALCHEMY_ECHO: 'false'
      MODE: celery
      MIGRATION_ENABLED: 'false'
      POSTGRES_HOST: llmops-db
      POSTGRES_PORT: 5432
      # Redis 连接使用 Docker 服务名
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      # Neo4j 连接（记忆系统 TKG）
      NEO4J_URI: bolt://llmops-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      # MinIO 连接（记忆系统对象存储）
      MINIO_ENDPOINT: http://llmops-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy

  llmops-celery-beat:
    image: llmops-api:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-celery-beat
    restart: always
    volumes:
      - ../api:/app/api
      - ./volumes/app/storage:/app/api/storage
    env_file:
      - ../api/.env
    environment:
      APP_ENV: production
      APP_DEBUG: '0'
      SQLALCHEMY_ECHO: 'false'
      MODE: celery-beat
      MIGRATION_ENABLED: 'false'
      POSTGRES_HOST: llmops-db
      POSTGRES_PORT: 5432
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://llmops-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      MINIO_ENDPOINT: http://llmops-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy

  llmops-redis:
    image: redis:8-alpine
    restart: always
    container_name: llmops-redis
    env_file:
      - ../api/.env
    volumes:
      - ./volumes/redis/data:/data
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --raw ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"

  llmops-db:
    image: pgvector/pgvector:pg18
    restart: always
    container_name: llmops-db
    env_file:
      - ../api/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data/pgdata
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  llmops-nginx:
    image: nginx:1.30-alpine
    restart: always
    container_name: llmops-nginx
    env_file:
      - ../api/.env
    environment:
      API_UPSTREAM_HOST: llmops-api
      API_UPSTREAM_PORT: 5001
      UI_UPSTREAM_HOST: llmops-ui
      UI_UPSTREAM_PORT: 3000
      KKFILEVIEW_UPSTREAM_HOST: llmops-kkfileview
      KKFILEVIEW_UPSTREAM_PORT: 8012
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/entrypoint.sh:/docker-entrypoint.sh
      - ./nginx/ssl:/etc/ssl
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      llmops-ui:
        condition: service_started
      llmops-api:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"

  # ==================== 文件预览服务（kkFileView，多格式在线预览） ====================
  llmops-kkfileview:
    image: keking/kkfileview:latest
    restart: always
    container_name: llmops-kkfileview
    environment:
      # 允许预览内网地址文件（docker 网络内通过 llmops-nginx 访问本地存储）
      KKFILEVIEW_DISABLE_INTERNAL_HOSTS: "false"
    ports:
      - "127.0.0.1:${KKFILEVIEW_PORT:-8012}:8012"
    depends_on:
      llmops-nginx:
        condition: service_started

  # ==================== 记忆系统容器（架构文档 v5.0 第 16 章） ====================

  llmops-neo4j:
    image: neo4j:2026-community
    restart: always
    container_name: llmops-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-openagent123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  llmops-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    container_name: llmops-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./volumes/minio/data:/data
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
