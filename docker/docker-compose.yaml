services:
  llmops-ui:
    image: llmops-ui:${IMAGE_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: ui/Dockerfile
    container_name: llmops-ui
    restart: always
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"

  llmops-api:
    image: llmops-api:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-api
    restart: always
    volumes:
      - ../api:/app/api
      - ./volumes/app/storage:/app/api/storage
      - ./docker-compose.yaml:/app/docker/docker-compose.yaml:ro
      - ./nginx/entrypoint.sh:/app/docker/nginx/entrypoint.sh:ro
      - ../ui/Dockerfile:/app/ui/Dockerfile:ro
    # 从 api/.env 读取配置
    env_file:
      - ../api/.env
    environment:
      # Docker 环境特定配置（覆盖 .env 中的对应配置）
      APP_ENV: production
      APP_DEBUG: '0'
      SERVER_THREAD_AMOUNT: 32
      GUNICORN_TIMEOUT: '0'
      SQLALCHEMY_ECHO: 'false'
      MODE: asgi
      # HTTP 层已 100% 迁移到 Quart（uvicorn 多 worker 承载）
      ASGI_WORKER_AMOUNT: 2
      # HTTP 单栈：Quart（uvicorn）承载全部 HTTP，Http 容器仅作依赖宿主
      SKILL_CATALOG_SYNC_ENABLED: 'true'
      MIGRATION_ENABLED: 'true'
      SYSTEM_ACCESS_WORKSPACE: /app/api/storage/system_access_workspace
      # kkFileView 预览：其服务端下载文件时使用的内网可达基础地址
      KKFILEVIEW_FILE_HOST: http://llmops-nginx:80
      POSTGRES_HOST: llmops-db
      POSTGRES_PORT: 5432
      # Redis 连接使用 Docker 服务名
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      # 进程级 checkpoint：以会话维度启用 LangGraph Redis 断点续传 + 工具执行登记表
      # （依赖 redis:8 内置 RediSearch FT.* 模块）。固化在此处（environment 优先于
      # env_file），即使 api/.env 丢失或未配置该键也能稳定生效。
      AGENT_CHECKPOINT_BY_CONVERSATION: '1'
      # Neo4j 连接（记忆系统 TKG）
      NEO4J_URI: bolt://llmops-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      # 浏览器自动化 / 电脑控制 worker（Docker 网络内使用服务名互通）
      BROWSER_AUTOMATION_URL: http://llmops-browser-worker:8766
      BROWSER_AUTOMATION_TOKEN: ${BROWSER_AUTOMATION_TOKEN:-dev-browser-worker-token}
      COMPUTER_CONTROL_URL: http://llmops-computer-worker:8767
      COMPUTER_CONTROL_TOKEN: ${COMPUTER_CONTROL_TOKEN:-dev-computer-worker-token}
    ports:
      - "127.0.0.1:${API_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy

  llmops-celery:
    image: llmops-api:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-celery
    restart: always
    volumes:
      - ../api:/app/api
      - ./volumes/app/storage:/app/api/storage
    # 从 api/.env 读取配置
    env_file:
      - ../api/.env
    environment:
      # Docker 环境特定配置（覆盖 .env 中的对应配置）
      APP_ENV: production
      APP_DEBUG: '0'
      SQLALCHEMY_ECHO: 'false'
      MODE: celery
      MIGRATION_ENABLED: 'false'
      # ⚠️ 必须排除 render 队列：Celery 未传 -Q 时会消费「全部已声明队列」，
      # 而 render 已登记进 task_queues。若不排除，本 worker 会以 -c 4 捞走
      # 渲染任务 → 4 并发渲染 ≈ 2.6G+，直接打爆 4C4G 单机（见部署文档 §3.3）。
      CELERY_QUEUES: celery,mail,consolidation
      POSTGRES_HOST: llmops-db
      POSTGRES_PORT: 5432
      # Redis 连接使用 Docker 服务名
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      # 进程级 checkpoint：会话维度启用（与 llmops-api 一致）
      AGENT_CHECKPOINT_BY_CONVERSATION: '1'
      # Neo4j 连接（记忆系统 TKG）
      NEO4J_URI: bolt://llmops-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy

  # 渲染 worker：独占消费 render 队列。
  # 为什么单独一个服务：渲染是分钟级长任务，且渲染镜像要塞进 Node24+Chromium+ffmpeg，
  # 体积与资源占用都远大于业务 worker；混在一起会抢占业务槽位（设计 §3.2）。
  # ⚠️ HYPERFRAMES_* 三件依赖只配在本服务上，勿配到 llmops-celery。
  # ⚠️ CELERY_QUEUES 必须为 render：不设则本 worker 会消费全部队列，隔离失效。
  llmops-render-worker:
    image: llmops-render:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile.render
    container_name: llmops-render-worker
    restart: always
    volumes:
      - ../api:/app/api
      - ./volumes/app/storage:/app/api/storage
    env_file:
      - ../api/.env
    environment:
      APP_ENV: production
      APP_DEBUG: '0'
      SQLALCHEMY_ECHO: 'false'
      MODE: celery
      MIGRATION_ENABLED: 'false'
      # 独占 render 队列（见 docker/entrypoint.sh 的 CELERY_QUEUES 支持）
      CELERY_QUEUES: render
      # 渲染吃满 CPU/内存，默认单并发，避免多进程争抢导致整体变慢
      CELERY_WORKER_AMOUNT: '1'
      # V8 默认堆 2240MB 已临界（CLI 自报只够 1 个 capture worker），显式压到 2048
      NODE_OPTIONS: --max-old-space-size=2048
      # 4C4G 上收紧渲染超时，避免长任务占满（见部署文档 §3.4）
      RENDER_TIMEOUT_SEC: '900'
      POSTGRES_HOST: llmops-db
      POSTGRES_PORT: 5432
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://llmops-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      # HyperFrames 三件依赖：镜像内已装，路径为 Debian 包默认位置
      HYPERFRAMES_BROWSER_PATH: /usr/bin/chromium
      HYPERFRAMES_FFMPEG_PATH: /usr/bin/ffmpeg
      HYPERFRAMES_FFPROBE_PATH: /usr/bin/ffprobe
      # CLI 为镜像内「本地安装」（全局安装会 Missing manifest），故给绝对路径
      HYPERFRAMES_CLI_BIN: /opt/hyperframes/node_modules/.bin/hyperframes
      HYPERFRAMES_CLI_VERSION: '0.8.42'
    # 渲染峰值实测 ~1.7G；限 2800M 给基础服务留出余量（4C4G 上不回旋超卖）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2800M
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy

  llmops-celery-beat:
    image: llmops-api:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-celery-beat
    restart: always
    volumes:
      - ../api:/app/api
      - ./volumes/app/storage:/app/api/storage
    env_file:
      - ../api/.env
    environment:
      APP_ENV: production
      APP_DEBUG: '0'
      SQLALCHEMY_ECHO: 'false'
      MODE: celery-beat
      MIGRATION_ENABLED: 'false'
      POSTGRES_HOST: llmops-db
      POSTGRES_PORT: 5432
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://llmops-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy

  llmops-browser-worker:
    image: llmops-worker:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile.worker
    container_name: llmops-browser-worker
    profiles: ["local-workers"]
    restart: always
    command: ["python", "scripts/browser_automation_worker.py"]
    volumes:
      - ../api:/app/api
    env_file:
      - ../api/.env
    environment:
      BROWSER_AUTOMATION_HOST: 0.0.0.0
      BROWSER_AUTOMATION_PORT: 8766
      BROWSER_AUTOMATION_TOKEN: ${BROWSER_AUTOMATION_TOKEN:-dev-browser-worker-token}
    ports:
      - "127.0.0.1:${BROWSER_AUTOMATION_PORT:-8766}:8766"

  llmops-computer-worker:
    image: llmops-worker:${IMAGE_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: Dockerfile.worker
    container_name: llmops-computer-worker
    profiles: ["local-workers"]
    restart: always
    command: ["sh", "-c", "xvfb-run -a python scripts/computer_control_worker.py"]
    volumes:
      - ../api:/app/api
    env_file:
      - ../api/.env
    environment:
      COMPUTER_CONTROL_HOST: 0.0.0.0
      COMPUTER_CONTROL_PORT: 8767
      COMPUTER_CONTROL_TOKEN: ${COMPUTER_CONTROL_TOKEN:-dev-computer-worker-token}
    ports:
      - "127.0.0.1:${COMPUTER_CONTROL_PORT:-8767}:8767"

  llmops-redis:
    image: redis:8-alpine
    restart: always
    container_name: llmops-redis
    env_file:
      - ../api/.env
    volumes:
      - ./volumes/redis/data:/data
    # redis:8-alpine 镜像自带 ReJSON/RediSearch 模块 .so（/usr/local/lib/redis/modules/），
    # 但默认精简 redis.conf 不加载；langgraph-checkpoint-redis 依赖 JSON.SET/FT.CREATE，
    # 因此显式加载 rejson + redisearch 两个模块（进程级 checkpoint 的前提）。
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --loadmodule /usr/local/lib/redis/modules/rejson.so --loadmodule /usr/local/lib/redis/modules/redisearch.so"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --raw ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"

  llmops-db:
    image: pgvector/pgvector:pg18
    restart: always
    container_name: llmops-db
    env_file:
      - ../api/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data/pgdata
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  llmops-nginx:
    image: nginx:1.30-alpine
    restart: always
    container_name: llmops-nginx
    env_file:
      - ../api/.env
    environment:
      API_UPSTREAM_HOST: llmops-api
      API_UPSTREAM_PORT: 5001
      UI_UPSTREAM_HOST: llmops-ui
      UI_UPSTREAM_PORT: 3000
      KKFILEVIEW_UPSTREAM_HOST: llmops-kkfileview
      KKFILEVIEW_UPSTREAM_PORT: 8012
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/entrypoint.sh:/docker-entrypoint.sh
      - ./nginx/ssl:/etc/ssl
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      llmops-ui:
        condition: service_started
      llmops-api:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"

  # ==================== 文件预览服务（kkFileView，多格式在线预览） ====================
  llmops-kkfileview:
    image: keking/kkfileview:latest
    restart: always
    container_name: llmops-kkfileview
    # 文档在线预览的必需组件（admin 迁移、文档预览均依赖），默认启动。
    environment:
      # 允许预览内网地址文件（docker 网络内通过 llmops-nginx 访问本地存储）
      KKFILEVIEW_DISABLE_INTERNAL_HOSTS: "false"
    ports:
      - "127.0.0.1:${KKFILEVIEW_PORT:-8012}:8012"
    depends_on:
      llmops-nginx:
        condition: service_started

  # ==================== 记忆系统容器（架构文档 v5.0 第 16 章） ====================

  llmops-neo4j:
    image: neo4j:2026-community
    restart: always
    container_name: llmops-neo4j
    # 记忆系统（TKG）的必需底座：ledger_writer / consolidation_engine /
    # degradation_manager / cold_storage_manager 等均依赖，默认启动。
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-openagent123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
