server {
    listen 3000;
    server_name _;

    # Socket.IO 升级头透传到 API 容器
    location /api/socket.io/ {
        proxy_pass http://llmops-api:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # API 反向代理：直接访问 3000 端口时也能正常调用后端
    location /api/ {
        proxy_pass http://llmops-api:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # 如果有其他文件（图片、字体、js脚本、样式表等），使用Nginx静态提供
    # 注意: 不对 JS/CSS 设置长缓存，因为 Vite 构建的 entry chunk hash 可能不变但内容变化
    location ~* \.(?:css|js|jpe?g|gif|svg|woff|woff2|eot|ttf|otf|ico|webp)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 访问静态页面时将路径转发到/index.html上，适用于单页面应用
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
