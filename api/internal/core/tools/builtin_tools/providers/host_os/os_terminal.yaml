name: os_terminal
label: 本机终端
description: 本机任务的主力执行手段：以 CMD 或 GitBash 执行真实命令（查看目录与文件、Git 操作、安装依赖、构建编译、运行测试与脚本、查看系统与进程信息、批量处理），一次性非交互返回 stdout/stderr 与退出码；工作目录限安全根目录内，删除类命令被硬阻断并引导改用 os_recycle_bin。
